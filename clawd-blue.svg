<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 144 56" width="144" height="56" role="img" aria-label="Clawd">
<!-- Official Claude Code Clawd, default pose. Body rgb(59,130,246), eyes clawd_background rgb(0,0,0). -->
<rect width="144" height="56" fill="none"/>
<g transform="translate(0,4)" shape-rendering="crispEdges">
<!-- y0 body -->
<rect x="24" y="0" width="8" height="8" fill="#3b82f6"/>
<rect x="32" y="0" width="96" height="8" fill="#3b82f6"/>
<!-- y1 body + black eyes at x=40 and x=104 -->
<rect x="24" y="8" width="16" height="8" fill="#3b82f6"/>
<rect x="40" y="8" width="8" height="8" fill="#000000"/>
<rect x="48" y="8" width="56" height="8" fill="#3b82f6"/>
<rect x="104" y="8" width="8" height="8" fill="#000000"/>
<rect x="112" y="8" width="16" height="8" fill="#3b82f6"/>
<!-- y2 full wide body -->
<rect x="8" y="16" width="136" height="8" fill="#3b82f6"/>
<!-- y3 -->
<rect x="24" y="24" width="104" height="8" fill="#3b82f6"/>
<!-- y4 feet ▝▝ ▝▝ -->
<rect x="40" y="32" width="8" height="8" fill="#3b82f6"/>
<rect x="56" y="32" width="8" height="8" fill="#3b82f6"/>
<rect x="88" y="32" width="8" height="8" fill="#3b82f6"/>
<rect x="104" y="32" width="8" height="8" fill="#3b82f6"/>
</g>
</svg>
